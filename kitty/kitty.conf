# vim:fileencoding=utf-8:foldmethod=marker

font_family          CaskaydiaCove Nerd Font Mono
bold_font            auto
italic_font          auto
bold_italic_font     auto
font_features        CaskaydiaCove-Nerd-Font-Mono +liga
font_size            14.0
background_opacity   1.0

# Ensure dracula.conf exists in the same folder
include              ~/.config/themes/current/kitty.conf

# Keybindings
map ctrl+shift+plus      change_font_size all +2.0
map ctrl+shift+minus     change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0

# Nerd Font Symbols (Fixed U+ case)
symbol_map U+E000-U+E00A,U+EA60-U+EBEB,U+E0A0-U+E0C8 Symbols Nerd Font Mono

cursor_shape beam
cursor_blink_interval 0

shell_integration no-cursor
