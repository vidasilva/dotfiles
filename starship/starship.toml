"$schema" = 'https://starship.rs/config-schema.json'

format = """[╭───](green) $username$directory$git_branch$git_status$python$aws$fill$cmd_duration
[╰──](green)$character """

palette = "dracula"

[fill]
symbol=" "

[username]
style_user = "bold cyan"
style_root = "bold red"
format = "[$user]($style) "
show_always = true

[character]
# INSERT mode (Default)
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
# NORMAL mode
vimcmd_symbol = "[❮](bold purple)"
# VISUAL mode
vimcmd_visual_symbol = "[❮](bold yellow)"
# REPLACE mode
vimcmd_replace_one_symbol = "[❮](bold pink)"
vimcmd_replace_symbol = "[❮](bold pink)"

[directory]
style = "bold cyan"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
style = "bold pink"

[git_status]
style = "bold red"
format = '([\[$all_status$stashed\]]($style) )'
stashed = '📦'
untracked = '?'
modified = '! '
staged = '+'
renamed = '»'
deleted = '✘'

[python]
style = "bold green"
symbol = "🐍 "
format = "[$symbol($virtualenv)]($style) "

[cmd_duration]
style = "bold yellow"

[aws]
style = "bold orange"

[palettes.dracula]
background = "#282a36"
current_line = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"

yellow="#F1FA8C"
orange = "#ffb86c"
cyan = "#8be9fd"
green = "#50fa7b"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
